<script>
'use strict';
/* =====================================================================
   STICK LIFE: WEST ALLIS - DIRECTOR'S CUT
   Single-file canvas life-sim. No external assets. Sections:
   1 Core  2 Data  3 Systems  4 UI  5 Art  6 Minigames (6b Nap Sync, 6c Menards Run, 6d The Climb)  7 Places  8 Events
   9 Quests/Endings  10 World  11 Scenes + main loop
   ===================================================================== */

/* ---------- 1. CORE ---------- */
const W = 960, H = 540;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const lerp = (a, b, t) => a + (b - a) * t;
const money = n => (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US');
function wpick(list) { // [{w:..}]
  let t = 0, last = null; for (const o of list) if (o.w > 0) { t += o.w; last = o; }
  let r = Math.random() * t;
  for (const o of list) { if (!(o.w > 0)) continue; r -= o.w; if (r <= 0) return o; }
  return last || list[list.length - 1]; /* zero-weight entries (e.g. the 0% flashlight) can never be picked */
}
function deepMerge(base, over) {
  if (Array.isArray(over) || typeof over !== 'object' || over === null) return over;
  const out = Array.isArray(base) ? base : Object.assign({}, base);
  for (const k of Object.keys(over)) out[k] = (base && typeof base[k] === 'object' && !Array.isArray(base[k]) && base[k] !== null) ? deepMerge(base[k], over[k]) : over[k];
  return out;
}
const errors = [];
window.addEventListener('error', e => errors.push(String(e.message)));

/* canvas sizing: CSS scaled, backing store follows devicePixelRatio */
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const cw = Math.floor(W * s), ch = Math.floor(H * s);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}
window.addEventListener('resize', resize);

/* ---------- AUDIO (Web Audio, procedural, mute toggle) ---------- */
const Snd = {
  ctx: null, mute: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); } catch (e) { this.ctx = null; }
  },
  tone(f, d, type = 'square', vol = 0.06, slide = 0, delay = 0) {
    if (this.mute || !this.ctx) return;
    const a = this.ctx, t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.02);
  },
  noise(d, vol = 0.05, delay = 0) {
    if (this.mute || !this.ctx) return;
    const a = this.ctx, n = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, n, a.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = a.createBufferSource(), g = a.createGain(); s.buffer = buf; g.gain.value = vol;
    s.connect(g); g.connect(a.destination); s.start(a.currentTime + delay);
  },
  play(n) {
    switch (n) {
      case 'blip': this.tone(520, 0.05, 'square', 0.035); break;
      case 'ok': this.tone(660, 0.07, 'square', 0.05); this.tone(880, 0.09, 'square', 0.05, 0, 0.06); break;
      case 'coin': this.tone(988, 0.07, 'square', 0.05); this.tone(1318, 0.16, 'square', 0.05, 0, 0.07); break;
      case 'bad': this.tone(200, 0.25, 'sawtooth', 0.06, -90); break;
      case 'hurt': this.tone(160, 0.18, 'sawtooth', 0.07, -80); this.noise(0.12, 0.05); break;
      case 'grind': this.noise(0.08, 0.04); this.tone(900 + Math.random() * 300, 0.05, 'sawtooth', 0.02); break;
      case 'thud': this.tone(110, 0.14, 'triangle', 0.1, -50); break;
      case 'door': this.tone(300, 0.08, 'triangle', 0.07); this.tone(220, 0.12, 'triangle', 0.07, 0, 0.07); break;
      case 'level': [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.12, 'square', 0.05, 0, i * 0.09)); break;
      case 'win': [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => this.tone(f, 0.16, 'square', 0.05, 0, i * 0.11)); break;
      case 'lose': [400, 330, 262, 196].forEach((f, i) => this.tone(f, 0.22, 'triangle', 0.07, 0, i * 0.16)); break;
      case 'mow': this.noise(0.05, 0.015); break;
      case 'honk': this.tone(180, 0.25, 'sawtooth', 0.05); break;
      case 'tick': this.tone(1200, 0.02, 'square', 0.03); break;
      case 'creak': this.tone(95, 0.42, 'sawtooth', 0.035, 45); this.tone(150, 0.26, 'triangle', 0.025, -40, 0.2); break; /* The Climb */
      case 'peep': this.tone(2600, 0.045, 'sine', 0.035, 500); this.tone(3100, 0.04, 'sine', 0.03, 300, 0.09); break;
      case 'crackle': for (let i = 0; i < 6; i++) this.noise(0.025, 0.012 + Math.random() * 0.01, i * 0.09 + Math.random() * 0.05); break;
      case 'whump': this.noise(0.9, 0.09); this.tone(70, 0.6, 'sawtooth', 0.09, -35); break;
      /* the weird layer (68_weird.js) */
      case 'hmm': this.noise(0.05, 0.008); this.tone(262, 0.22, 'sine', 0.03, -26); this.tone(220, 0.34, 'sine', 0.026, -18, 0.26); break; /* a baby monitor, from a long way off */
      case 'hush': this.noise(1.4, 0.016); this.tone(120, 1.6, 'sine', 0.04, -70); break;
      case 'dot': this.tone(880, 0.7, 'sine', 0.03); this.tone(1320, 0.9, 'sine', 0.014, 0, 0.12); break;
      case 'star': this.tone(2300 + Math.random() * 600, 0.14, 'sine', 0.012); break;
      case 'hatch': for (let i = 0; i < 3; i++) this.tone(1500 - i * 140, 0.03, 'square', 0.025, 0, i * 0.12); this.tone(2900, 0.05, 'sine', 0.035, 500, 0.5); this.tone(3300, 0.05, 'sine', 0.03, 300, 0.6); break;
      case 'wind': this.noise(0.7, 0.014); break;
      case 'fade': this.tone(392, 1.6, 'sine', 0.03, -120); this.tone(294, 1.8, 'sine', 0.02, -60, 0.2); break;
      case 'page': this.tone(1500, 0.02, 'triangle', 0.02); break;
    }
  }
};

/* ---------- INPUT (keyboard + virtual touch buttons) ---------- */
const Input = {
  down: {}, pressed: {}, num: 0, textHandler: null, touchOn: false,
  raw: {}, rawp: {}, ptr: { x: -1, y: -1, down: false, pressed: false, up: false }, /* raw key codes + canvas pointer (mouse/touch), used by Nap Sync */
  map: { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    Enter: 'act', Space: 'act', KeyE: 'act', KeyZ: 'act', Escape: 'back', Backspace: 'back', KeyX: 'back', Tab: 'menu', KeyQ: 'menu',
    KeyP: 'phone', KeyM: 'mute', KeyC: 'drive', KeyT: 'touch' },
  press(a) { if (!this.down[a]) this.pressed[a] = true; this.down[a] = true; },
  release(a) { this.down[a] = false; },
  endFrame() { this.pressed = {}; this.rawp = {}; this.num = 0; this.ptr.pressed = false; if (this.ptr.up) { this.ptr.down = false; this.ptr.up = false; } }
};
const typingInDom = e => (typeof Xfer !== 'undefined' && Xfer.on) || (e.target && /^(TEXTAREA|INPUT|SELECT)$/.test(e.target.tagName || ''));
window.addEventListener('keydown', e => {
  if (typeof Xfer !== 'undefined' && Xfer.on && e.key === 'Escape') { e.preventDefault(); Xfer.close(); return; } /* Esc closes export/import even if focus slipped off the text box */
  if (typingInDom(e)) return;
  Snd.init();
  if (Input.textHandler) { if (Input.textHandler(e)) { e.preventDefault(); } return; }
  if (!e.repeat) { Input.raw[e.code] = true; Input.rawp[e.code] = true; }
  const a = Input.map[e.code];
  if (/^Digit[1-9]$/.test(e.code)) { Input.num = +e.code.slice(5); }
  if (a) {
    e.preventDefault();
    if (e.repeat) { if (a === 'up' || a === 'down' || a === 'left' || a === 'right') Input.pressed[a] = true; }
    else Input.press(a);
  }
});
window.addEventListener('keyup', e => { if (typingInDom(e)) return; delete Input.raw[e.code]; const a = Input.map[e.code]; if (a) Input.release(a); });
window.addEventListener('blur', () => { Input.down = {}; Input.raw = {}; });
/* canvas pointer (mouse + touch) in 960x540 game coordinates */
function ptrMove(e) { const r = cv.getBoundingClientRect(); Input.ptr.x = (e.clientX - r.left) / r.width * W; Input.ptr.y = (e.clientY - r.top) / r.height * H; }
cv.addEventListener('pointerdown', e => { ptrMove(e); Input.ptr.down = true; Input.ptr.pressed = true; Input.ptr.up = false; });
cv.addEventListener('pointermove', ptrMove);
window.addEventListener('pointerup', () => { Input.ptr.up = true; });
window.addEventListener('pointercancel', () => { Input.ptr.up = true; });
window.addEventListener('pointerdown', () => Snd.init());
document.querySelectorAll('#touch .tb').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); Snd.init(); Input.press(k); b.classList.add('hot'); };
  const off = e => { e.preventDefault(); Input.release(k); b.classList.remove('hot'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
});
function setTouch(on) {
  Input.touchOn = on; document.getElementById('touch').classList.toggle('on', on);
}
if ((window.matchMedia && matchMedia('(pointer:coarse)').matches) || 'ontouchstart' in window) setTouch(true);

/* ---------- SETTINGS + SAVE ---------- */
const SAVE_KEYS = { auto: 'stickrpg_wa_auto_v1', s1: 'stickrpg_wa_slot1_v1' };
const SET_KEY = 'stickrpg_wa_settings_v1';
function loadSettings() {
  try { const s = JSON.parse(localStorage.getItem(SET_KEY) || '{}'); Snd.mute = !!s.mute; if (s.touch) setTouch(true); return s; } catch (e) { return {}; }
}
function saveSettings() { try { localStorage.setItem(SET_KEY, JSON.stringify({ mute: Snd.mute, touch: Input.touchOn })); } catch (e) {} }
function saveGame(slot = 'auto') {
  try { S.savedAt = Date.now(); localStorage.setItem(SAVE_KEYS[slot], JSON.stringify(S)); return true; } catch (e) { return false; }
}
function readSave(slot) {
  try { const r = localStorage.getItem(SAVE_KEYS[slot]); return r ? JSON.parse(r) : null; } catch (e) { return null; }
}
function loadGame(slot) {
  const d = readSave(slot); if (!d) return false;
  S = deepMerge(newState(d.name || 'Adam'), d);
  return true;
}
function saveInfo(slot) {
  const d = readSave(slot); if (!d) return null;
  return { name: d.name, day: Math.floor(d.t / 1440) + 1, cash: d.cash, at: d.savedAt };
}
function latestSlot() {
  const a = readSave('auto'), b = readSave('s1');
  if (!a && !b) return null; if (a && !b) return 'auto'; if (b && !a) return 's1';
  return (a.savedAt || 0) >= (b.savedAt || 0) ? 'auto' : 's1';
}

/* ---------- CALENDAR / WEATHER ---------- */
const dayNum = () => Math.floor(S.t / 1440);
const hourF = () => (S.t % 1440) / 60;
const mIdx = (d = dayNum()) => Math.floor(d / MONTH_DAYS) % 12;
const dom = (d = dayNum()) => d % MONTH_DAYS + 1;
const wday = (d = dayNum()) => (4 + d) % 7;
const isWinter = () => { const m = mIdx(); return m >= 2 && m <= 5; };
function temp() {
  const d = dayNum(), m = mIdx(d), f = (d % MONTH_DAYS) / MONTH_DAYS;
  const base = lerp(MONTH_TEMP[m], MONTH_TEMP[m + 1], f);
  const daily = Math.sin(d * 12.9898) * 6;
  const diurnal = -Math.cos((hourF() - 4) / 24 * Math.PI * 2) * 5;
  return Math.round(base + daily + diurnal);
}
function clockStr(t = S.t) {
  const h = Math.floor((t % 1440) / 60), m = Math.floor(t % 60);
  const ap = h >= 12 ? 'PM' : 'AM', hh = h % 12 === 0 ? 12 : h % 12;
  return hh + ':' + String(m).padStart(2, '0') + ' ' + ap;
}
const dateStr = (d = dayNum()) => DAYN[wday(d)] + ' ' + MONTHS[mIdx(d)] + ' ' + dom(d);
function hrsStr(h) { const hh = Math.floor(h); const m = Math.round((h - hh) * 60); const ap = hh >= 12 && hh < 24 ? 'PM' : 'AM'; const x = hh % 12 === 0 ? 12 : hh % 12; return x + (m ? ':' + String(m).padStart(2, '0') : '') + ap; }
function isOpen(p) { const h = hourF(); return h >= p.open[0] && h < p.open[1]; }

  const mult = new Set(['wear', 'grind', 'point', 'mix', 'ladder', 'mow']);

  for (const id in S.inv) if (S.inv[id] > 0 && ITEMS[id] && ITEMS[id].passive) ap(id);
  for (const s in S.eq) if (S.eq[s] && has(S.eq[s])) ap(S.eq[s]);
  if (luckActive()) f.luck += 8;
  return f;
}
const chaTotal = () => S.st.cha + fx().cha;
const toolTotal = () => S.st.tool + fx().toolb;
const perf = () => clamp(0.55 + S.energy / 100 * 0.5 - S.sleepDebt / 400, 0.5, 1.05); // tiredness modifier

/* ---------- TIME ENGINE ---------- */
function advance(mins, o = {}) {
  let left = mins;
  while (left > 0) { const st = Math.min(10, left); left -= st; tickMinutes(st, o); }
}
function tickMinutes(m, o) {
  const prevH = Math.floor(S.t / 60), prevD = dayNum();
  S.t += m; const hrs = m / 60;
  if (!o.sleeping) {
    const late = (hourF() >= 22 || hourF() < 5) ? 1.4 : 1;
    if (!o.noEnergy) S.energy -= 1.7 * hrs * (1 + S.sleepDebt / 120) * late;
    S.hunger -= 3.3 * hrs;
    S.happy += ((S.family > 70 ? 62 : 48) - S.happy) * 0.03 * hrs;
    if (!o.home) S.family -= 0.3 * hrs;
    if (S.hunger <= 0) { S.hp -= 2.2 * hrs; S.happy -= 1.5 * hrs; }
    if (!o.home && temp() < 30 && !fx().cold && !o.sleeping) { S.hp -= 0.7 * hrs; S.energy -= 0.9 * hrs; }
  }
  S.energy = clamp(S.energy, 0, maxEnergy()); S.hunger = clamp(S.hunger, 0, 100); S.happy = clamp(S.happy, 0, 100);
  S.family = clamp(S.family, 0, 100); S.hp = clamp(S.hp, -5, S.body);
  if (Math.floor(S.t / 60) !== prevH) onHour(o);
  if (dayNum() !== prevD) onNewDay();
}
function onHour(o) {
  // settle online listings
  for (const l of S.listings.slice()) if (S.t >= l.ready) {

  }
  reheatTick(o);
  const h = hourF();
  if (h === 16 && wday() === 5) toast('Fish fry Friday! Hank\'s Tap is serving at 4PM.', '#fc8');
  if (!o.sleeping && S.t > S.nextEvent && chance(0.11)) { S.nextEvent = S.t + 150; rollEvent(); }
  if (o.sleeping) return;
  if (S.hunger < 20 && chance(0.5)) toast('Stomach growls. Culver\'s?', '#fa8');
  if (S.energy < 20 && chance(0.5)) toast('You are fading. Coffee or bed.', '#fa8');
}

function payBills() {

/* ---------- WORK COST / VITALS ---------- */
function workCost(o) { // {wear, energy, hours, skill}
  const f = fx();
  let w = (o.wear || 0) * 1.5 * f.wear * (1 - Math.min(0.35, S.st.end * 0.015));
  if (o.skill) w *= (1 - Math.min(0.5, toolTotal() * 0.03));
  S.body = Math.max(0, S.body - w);
  S.hp = Math.max(-5, S.hp - w * 2.2 - (o.hp || 0));
  S.energy = clamp(S.energy - (o.energy || 0) * (o.skill ? 1 : 1) * (1.15 - perf() * 0.25), 0, maxEnergy());
  advance((o.hours || 1) * 60, { noEnergy: true });
  S.hp = Math.min(S.hp, S.body);
  return w;
}

}

/* ---------- SLEEP ---------- */
function bedtimeAsk() {
  const h = hourF();
  if (h >= 7 && h < 18.5 && S.energy > 25) {
    Dialog.say('You', 'It\'s the middle of the day. Sleeping now would cost you the whole day. Try a nap instead.'); return;
  }
  Dialog.ask('Bedtime', 'Twins are asleep. For now. Who takes the 2 AM bottle?', [
    { t: 'Straight to bed (hope for the best)', fn: () => doSleep(false) },
    { t: 'I\'ll take the night shift (+family, less sleep)', fn: () => doSleep(true) },
    { t: 'Not yet', fn: () => {} }
  ]);
}
function doSleep(nightShift) {
  sitDown('bed');
  let target = dayNum() * 1440 + 6.5 * 60; if (S.t >= target) target += 1440;
  const mins = target - S.t;
  const wakes = nightShift ? 2 : rndi(0, 3);
  const eff = Math.max(1.5, mins / 60 - wakes * 0.8);
  advance(mins, { sleeping: true, home: true });
  const debtBefore = S.sleepDebt;
  S.sleepDebt = clamp(S.sleepDebt + (8 - eff) * 6, 0, 100);
  S.energy = clamp(S.energy + eff * 15 + 10, 0, maxEnergy());
  S.hp = clamp(S.hp + eff * 7, 0, S.body);
  S.hunger = clamp(S.hunger - 18, 0, 100);
  let heal = 0;
  if (eff >= 6.5 && S.sleepDebt < 45) { heal = 0.35 + (has('heatpad') ? 0.35 : 0) + (S.family > 70 ? 0.1 : 0); S.body = clamp(S.body + heal, 0, 100); }
  if (nightShift) { S.family = clamp(S.family + 7, 0, 100); S.happy = clamp(S.happy + 3, 0, 100); }
  S.family = clamp(S.family + 2, 0, 100);
  S.c.sleeps++; if (S.c.chimneys >= 1) S.f.homeAfter = 1; S.x = place('home').x + 20;
  S.day.home = 0;
  Snd.play('ok');
  const wk = ['slept like a log (suspicious)', 'got woken up once', 'got woken up twice', 'heard "WAAAAH" in stereo three times'][wakes];
  Dialog.say('Morning', clockStr() + '. You ' + wk + '. Slept about ' + eff.toFixed(1) + ' effective hours. Sleep debt ' + (S.sleepDebt > debtBefore ? 'up' : 'down') + ' to ' + Math.round(S.sleepDebt) + '.' + (heal ? ' Your back whispers a small thank-you (+' + heal.toFixed(2) + ' body).' : ''));
  saveGame('auto');
}
function nap() {
  if (S.energy > 92) { Dialog.say('You', 'You are not remotely tired. Impressive. Concerning.'); return; }
  sitDown('couch');
  advance(60, { home: true, noEnergy: true });
  S.energy = clamp(S.energy + 12, 0, maxEnergy()); S.sleepDebt = clamp(S.sleepDebt - 2, 0, 100); S.hp = clamp(S.hp + 4, 0, S.body);
  toast('Couch nap: +12 energy. Drool: +1.', '#8cf'); Snd.play('ok');
}

/* ---------- 5. ART (all procedural) ---------- */
const mixc = (a, b, t) => { const p = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; const A = p(a), B = p(b); return 'rgb(' + A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',') + ')'; };
function rgbOf(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }

/** Stick figure. (x,y)=feet. o: s scale, f facing, ph walk phase, sp 0..1 speed, shirt, pants, hat, hatC, hair, hairC, arm, mood */
function stick(c, x, y, o) {
  o = o || {}; const s = o.s || 1, ph = o.ph || 0, sp = o.sp || 0;
  c.save(); c.translate(x, y); c.scale(o.f || 1, 1);
  const bob = -Math.abs(Math.sin(ph)) * 2 * s * sp;
  const hipY = -22 * s + bob, neckY = hipY - 19 * s, hr = 8 * s, headY = neckY - hr + 1 * s;
  c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = 3.2 * s;
  const sw = Math.sin(ph) * 0.8 * sp;
  c.strokeStyle = o.pants || '#2f3d5a';
  for (const d of [-1, 1]) { const a = sw * d; c.beginPath(); c.moveTo(0, hipY); c.lineTo(Math.sin(a) * 14 * s, hipY + Math.cos(a) * 22 * s); c.stroke(); }
  c.strokeStyle = o.shirt || '#4a8f3a'; c.lineWidth = 7 * s; c.beginPath(); c.moveTo(0, hipY); c.lineTo(0, neckY); c.stroke();
  c.strokeStyle = o.line || '#222'; c.lineWidth = 3 * s;
  const shY = neckY + 3 * s;
  if (o.arm === 'up') { c.beginPath(); c.moveTo(0, shY); c.lineTo(10 * s, shY - 14 * s); c.moveTo(0, shY); c.lineTo(-6 * s, shY - 10 * s); c.stroke(); }
  else if (o.arm === 'hold') { c.beginPath(); c.moveTo(0, shY); c.lineTo(12 * s, shY + 8 * s); c.moveTo(0, shY); c.lineTo(8 * s, shY + 12 * s); c.stroke(); }
  else { for (const d of [-1, 1]) { const a = -sw * d * 1.1; c.beginPath(); c.moveTo(0, shY); c.lineTo(Math.sin(a) * 13 * s, shY + Math.cos(a) * 15 * s); c.stroke(); } }
  // head
  c.fillStyle = o.skin || '#ffe8c4'; c.strokeStyle = o.line || '#222'; c.lineWidth = 2.6 * s;
  c.beginPath(); c.arc(0, headY, hr, 0, 7); c.fill(); c.stroke();
  // hair / hat
  const top = (col, extra) => { c.fillStyle = col; c.beginPath(); c.arc(0, headY, hr + 1.2 * s, Math.PI * 1.02, Math.PI * 1.98); c.closePath(); c.fill(); c.stroke(); };
  const hat = o.hat;
  if (hat === 'beanie') { top(o.hatC || '#c55'); c.fillStyle = o.hatC || '#c55'; c.beginPath(); c.arc(0, headY - hr - 1.5 * s, 2.6 * s, 0, 7); c.fill(); }
  else if (hat === 'cap') { top(o.hatC || '#16306b'); c.fillStyle = o.hatC || '#16306b'; c.fillRect(2 * s, headY - 3.5 * s, 11 * s, 3 * s); if (o.hatC2) { c.fillStyle = o.hatC2; c.fillRect(-1 * s, headY - 8 * s, 3 * s, 3 * s); } }
  else if (hat === 'hard') { top('#f1c40f'); c.fillStyle = '#f1c40f'; c.fillRect(-hr - 2 * s, headY - 2.6 * s, hr * 2 + 6 * s, 2.8 * s); }
  else if (hat === 'cheese') { c.fillStyle = '#ffd23a'; c.beginPath(); c.moveTo(-hr - 3 * s, headY - 2 * s); c.lineTo(hr + 3 * s, headY - 2 * s); c.lineTo(hr * 0.2, headY - hr - 8 * s); c.closePath(); c.fill(); c.stroke(); c.fillStyle = '#c99'; c.fillStyle = '#d49b00'; [[-3, -6], [3, -4], [0, -9]].forEach(p => { c.beginPath(); c.arc(p[0] * s, headY + p[1] * s, 1.3 * s, 0, 7); c.fill(); }); }
  else if (o.hair === 'pony') { top(o.hairC || '#6b4423'); c.strokeStyle = o.hairC || '#6b4423'; c.lineWidth = 3.4 * s; c.beginPath(); c.moveTo(-hr, headY - 2 * s); c.quadraticCurveTo(-hr - 9 * s, headY + 2 * s, -hr - 5 * s, headY + 10 * s); c.stroke(); }
  else if (o.hair === 'long') { top(o.hairC || '#6b4423'); c.strokeStyle = o.hairC || '#6b4423'; c.lineWidth = 3.4 * s; c.beginPath(); c.moveTo(-hr + 1 * s, headY); c.lineTo(-hr, headY + 10 * s); c.stroke(); }
  else if (o.hair === 'pig') { top(o.hairC || '#c9892b'); c.fillStyle = o.hairC || '#c9892b'; [-1, 1].forEach(d => { c.beginPath(); c.arc(d * (hr + 2 * s), headY + 1 * s, 2.8 * s, 0, 7); c.fill(); }); }
  else if (o.hair === 'bow') { c.fillStyle = '#f48fb1'; c.beginPath(); c.moveTo(0, headY - hr); c.lineTo(-4 * s, headY - hr - 4 * s); c.lineTo(-4 * s, headY - hr + 1 * s); c.moveTo(0, headY - hr); c.lineTo(4 * s, headY - hr - 4 * s); c.lineTo(4 * s, headY - hr + 1 * s); c.fill(); }
  else if (o.hair === 'short') top(o.hairC || '#6b4423');
  else if (o.hair === 'gray') { top('#bbb'); }
  // face
  c.fillStyle = '#222'; c.beginPath(); c.arc(3 * s, headY - 1 * s, 1.1 * s, 0, 7); c.fill();
  c.strokeStyle = '#222'; c.lineWidth = 1.4 * s; c.beginPath();
  const m = o.mood || 'ok';
  if (m === 'sad') c.arc(2 * s, headY + 6.2 * s, 2.4 * s, Math.PI * 1.15, Math.PI * 1.85);
  else if (m === 'happy') c.arc(2 * s, headY + 2.8 * s, 3 * s, 0.2, Math.PI - 0.2);
  else { c.moveTo(0.5 * s, headY + 4.2 * s); c.lineTo(4.4 * s, headY + 4.2 * s); }
  c.stroke();
  c.restore();
}

function adamLook() {
  const L = { shirt: '#4a8f3a', pants: '#3b4766', hat: 'beanie', hatC: '#6d6d6d', hair: 'short' };

/* ---------- sky + backdrop ---------- */
const SKY = [[0, '#0a0e24', '#1a2142'], [5, '#151a3f', '#3a3566'], [6.5, '#5b7fc7', '#f4a66a'], [8, '#5fb4ee', '#cdeaff'], [17, '#5fb4ee', '#cdeaff'], [18.5, '#6a6fc2', '#f48a5a'], [20, '#1d2150', '#512e5f'], [21.5, '#0a0e24', '#1a2142'], [24, '#0a0e24', '#1a2142']];
function skyCols(h) {
  for (let i = 0; i < SKY.length - 1; i++) {
    const a = SKY[i], b = SKY[i + 1]; if (h >= a[0] && h <= b[0]) { const t = (h - a[0]) / (b[0] - a[0] || 1); return [mixc(a[1], b[1], t), mixc(a[2], b[2], t)]; }
  }
  return [SKY[0][1], SKY[0][2]];
}
function darkness(h) { if (h < 5) return 0.62; if (h < 7) return 0.62 * (1 - (h - 5) / 2); if (h < 18) return 0; if (h < 21) return 0.62 * (h - 18) / 3; return 0.62; }
const season = () => { const m = mIdx(); return m <= 1 ? 'fall' : m <= 5 ? 'winter' : m === 6 ? 'spring' : 'summer'; };
const STARS = Array.from({ length: 70 }, (_, i) => [(i * 137.5) % W, (i * 53.7) % 220, 0.6 + (i % 3) * 0.5]);
const parts = []; // snow / leaves
let animT = 0;

function drawBackdrop(cam, h) {
  const [top, bot] = skyCols(h);
  const g = ctx.createLinearGradient(0, 0, 0, GY); g.addColorStop(0, top); g.addColorStop(1, bot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const dk = darkness(h);
  if (dk > 0.2) { ctx.fillStyle = '#fff'; for (const s of STARS) { ctx.globalAlpha = Math.min(1, (dk - 0.2) * 2) * (0.5 + 0.5 * Math.sin(animT * 2 + s[0])); ctx.fillRect(s[0], s[1], s[2], s[2]); } ctx.globalAlpha = 1; }
  // sun / moon
  const sunT = (h - 6) / 13; // 6..19
  if (sunT > 0 && sunT < 1) { const sx = lerp(80, W - 80, sunT), sy = 300 - Math.sin(sunT * Math.PI) * 240; ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.arc(sx, sy, 28, 0, 7); ctx.fill(); ctx.fillStyle = 'rgba(255,240,150,.25)'; ctx.beginPath(); ctx.arc(sx, sy, 46, 0, 7); ctx.fill(); }
  else { const mt = ((h + 24 - 19) % 24) / 11; if (mt > 0 && mt < 1) { const mx = lerp(80, W - 80, mt), my = 290 - Math.sin(mt * Math.PI) * 220; ctx.fillStyle = '#eef1ff'; ctx.beginPath(); ctx.arc(mx, my, 20, 0, 7); ctx.fill(); ctx.fillStyle = bot; ctx.beginPath(); ctx.arc(mx + 8, my - 4, 17, 0, 7); ctx.fill(); } }
  // clouds
  ctx.fillStyle = 'rgba(255,255,255,' + (0.75 - dk * 0.6) + ')';
  for (let i = 0; i < 5; i++) { const cx = ((i * 260 + animT * 6 - cam * 0.05) % (W + 200)) - 100, cy = 60 + (i * 37) % 90; ctx.beginPath(); ctx.arc(cx, cy, 20, 0, 7); ctx.arc(cx + 22, cy - 6, 25, 0, 7); ctx.arc(cx + 48, cy, 18, 0, 7); ctx.fill(); }
  // far silhouettes (parallax .12): State Fair ferris wheel, water tower, steeple, old Allis-Chalmers works
  const sil = mixc('#8aa0c0', '#141a33', dk / 0.62), sil2 = mixc('#7a92b4', '#10162b', dk / 0.62);
  const fp = -cam * 0.12;
  ctx.fillStyle = sil; ctx.strokeStyle = sil; ctx.lineWidth = 3;
  for (let rep = 0; rep < 2; rep++) {
    const ox = fp + rep * 1900 - 100;
    // factory
    ctx.fillRect(ox + 100, 250, 150, 180); ctx.fillRect(ox + 130, 190, 18, 62); ctx.fillRect(ox + 190, 205, 16, 50);
    for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.moveTo(ox + 100 + k * 40, 250); ctx.lineTo(ox + 120 + k * 40, 225); ctx.lineTo(ox + 140 + k * 40, 250); ctx.fill(); }
    // ferris wheel
    const wx = ox + 620, wy = 245, wr = 100; ctx.fillStyle = sil2; ctx.beginPath(); ctx.moveTo(wx - 40, 440); ctx.lineTo(wx, wy); ctx.lineTo(wx + 40, 440); ctx.stroke();
    ctx.beginPath(); ctx.arc(wx, wy, wr, 0, 7); ctx.stroke();
    for (let k = 0; k < 10; k++) { const a = animT * 0.15 + k * Math.PI / 5; ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx + Math.cos(a) * wr, wy + Math.sin(a) * wr); ctx.stroke(); ctx.fillStyle = k % 2 ? '#e86' : '#6ae'; if (dk > 0.3) ctx.fillStyle = k % 2 ? '#fd5' : '#f6b'; ctx.fillRect(wx + Math.cos(a) * wr - 4, wy + Math.sin(a) * wr - 4, 8, 8); }
    // water tower
    ctx.fillStyle = sil; ctx.fillRect(ox + 1050, 330, 6, 100); ctx.fillRect(ox + 1090, 330, 6, 100); ctx.beginPath(); ctx.ellipse(ox + 1073, 318, 36, 30, 0, 0, 7); ctx.fill(); ctx.fillRect(ox + 1037, 318, 72, 10);
    // steeple
    ctx.fillRect(ox + 1400, 300, 50, 130); ctx.beginPath(); ctx.moveTo(ox + 1395, 300); ctx.lineTo(ox + 1425, 220); ctx.lineTo(ox + 1455, 300); ctx.fill(); ctx.fillRect(ox + 1423, 195, 4, 30); ctx.fillRect(ox + 1416, 205, 18, 4);
    ctx.fillRect(ox + 1500, 360, 140, 70);
  }
  // mid layer: suburban rooflines + trees (.4)
  const mp = -cam * 0.4;
  const col = mixc(season() === 'winter' ? '#c5d0dc' : '#5d8c4a', '#101a2a', dk / 0.62);
  const roofc = mixc(season() === 'winter' ? '#e8eef5' : '#7b5a4a', '#101828', dk / 0.62);
  for (let i = 0; i < 24; i++) {
    const hx = ((i * 230 + mp) % (24 * 230) + 24 * 230) % (24 * 230) - 230;
    if (hx > W + 100 || hx < -300) continue;
    const hh = 40 + (i * 37) % 30;
    ctx.fillStyle = mixc('#a9a089', '#141a2a', dk / 0.62); ctx.fillRect(hx, GY - 30 - hh, 90, hh + 30 - 0);
    ctx.fillStyle = roofc; ctx.beginPath(); ctx.moveTo(hx - 8, GY - 30 - hh); ctx.lineTo(hx + 45, GY - 62 - hh); ctx.lineTo(hx + 98, GY - 30 - hh); ctx.fill();
    ctx.fillStyle = mixc('#9a5a44', '#1a1520', dk / 0.62); ctx.fillRect(hx + 68, GY - 78 - hh, 10, 24);
    if (dk > 0.3 && i % 3 !== 1) { ctx.fillStyle = 'rgba(255,220,120,.85)'; ctx.fillRect(hx + 14, GY - 20 - hh, 12, 14); ctx.fillRect(hx + 56, GY - 20 - hh, 12, 14); }
    if (i % 2) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(hx + 120, GY - 56, 22, 0, 7); ctx.fill(); ctx.fillRect(hx + 117, GY - 40, 6, 40); }
  }
}

function drawGround(cam, h) {
  const dk = darkness(h), win = season() === 'winter';
  ctx.fillStyle = win ? '#e9eef2' : season() === 'fall' ? '#7d9a4a' : '#5aa844'; ctx.fillRect(0, GY - 20, W, 30);

  ctx.fillStyle = '#7d7d7d'; ctx.fillRect(0, GY + 18, W, 4);

function tree(c, x, base, s, season_) {
  c.fillStyle = '#6b4423'; c.fillRect(x - 5 * s, base - 50 * s, 10 * s, 50 * s);
  c.fillStyle = season_ === 'winter' ? '#f2f6fa' : season_ === 'fall' ? (x % 3 > 1 ? '#d9822b' : '#c9a02f') : '#3f9142';

function drawPlaceArt(p, dk) {

/* ---------- 6d. THE CLIMB (final-level chimney job; optional replay as "second chimney") ----------

function climbState() { /* old saves get defaults from newState() via deepMerge; this also guards a hand-edited save */
  if (!S.climb || typeof S.climb !== 'object') S.climb = {};
  const d = { runs: 0, day: -1, carry: 0, nextNo: 1, book: [], ghostSeen: 0, last: null };
  for (const k in d) if (S.climb[k] === undefined) S.climb[k] = d[k];
  if (!Array.isArray(S.climb.book)) S.climb.book = [];
  return S.climb;
}
const climbUnlocked = () => S.c.chimneys >= CL_UNLOCK_JOBS || !!S.f.climbOpen;
const climbLabel = () => climbState().runs > 0 ? 'Second chimney (next door)' : 'The Climb (final chimney job)';
function climbBlock() { // '' when The Climb can be started right now
  const cs = climbState(), h = hourF();
  if (!climbUnlocked()) return 'Bro has not offered it yet. Finish ' + CL_UNLOCK_JOBS + ' chimney jobs first (' + S.c.chimneys + '/' + CL_UNLOCK_JOBS + ').';
  if (h < 7 || h >= 13) return 'A full flue takes the better part of an afternoon. Start between 7 AM and 1 PM.';
  if (cs.day === dayNum()) return 'One flue a day. The chimney will be there tomorrow. That is the problem with chimneys.';
  if (S.energy < CL_ENERGY_MIN) return 'You need about ' + CL_ENERGY_MIN + ' energy for a flue. Coffee, a donut, a nap.';
  if (S.hp < 15) return 'Your body filed a note. Heal up before you go up.';
  return '';
}

function ClimbGame(o) {

    act(id) {

  UI.closeAll();

}
function runChimney(job, assist) {
  const K = KIND[job.kind]; const stages = assist ? ['ladder', 'point'] : K.stages.slice();
  if (!assist && (job.kind === 'tuck' || job.kind === 'crown') && (job.fight != null ? !!job.fight : chance(0.1))) stages.splice(1, 0, 'fight'); /* job.fight forces/forbids the surprise raccoon (tests); default 10% */
  const scores = []; let fell = false, tip = 0, i = 0; const per = (assist ? 2.5 : K.hrs) / stages.length; const size = job.size || 1;
  const next = () => {
    if (i >= stages.length) return fin();
    const st = stages[i++]; let g;
    switch (st) {
      case 'ladder': g = LadderGame(); break;
      case 'grind': g = JointGame('grind', size); break;
      case 'point': g = JointGame('point', assist ? 1 : size); break;
      case 'mix': g = MixGame(); break;
      case 'chip': g = TimingGame({ title: 'Chip off the cracked crown', kind: 'chip', rounds: 4, speed: 1.15, w: 0.2, done: 'Crown demolished.' }); break;
      case 'crown': g = TimingGame({ title: 'Trowel in the new crown', kind: 'crown', rounds: 4, speed: 1.1, w: 0.17 * fx().point, done: 'Smooth, sloped, drip-edged. Poetry.' }); break;
      case 'cap': g = TimingGame({ title: 'Set the chimney cap', kind: 'cap', rounds: 3, speed: 1.05, w: 0.22, done: 'Cap secured. Squirrel, evicted.' }); break;
      case 'sweep': g = TimingGame({ title: 'Sweep the flue', kind: 'sweep', rounds: 4, speed: 1.1, w: 0.22, done: 'Soot everywhere. Satisfying.' }); break;
      case 'fight': Dialog.say('Narrator', 'From inside the flue: a hiss. A pair of eyes. It\'s a raccoon, and it does not have a lease.'); g = FightGame('raccoon'); break;
    }
    Mini.start(g, res => {
      if (st === 'ladder' && res.fell) { fell = true; S.hp -= 8; S.happy = clamp(S.happy - 4, 0, 100); }
      if (st === 'fight') { if (res.win) { tip += 35; S.biz.rep += 1; toast('Raccoon evicted! Customer tips +$35.', '#8f8'); } else if (S.hp <= 0) S.hp = 3; }
      scores.push(res.score); advance(per * 60, { noEnergy: true }); next();
    });
  };
  const fin = () => {
    let q = scores.reduce((a, b) => a + b, 0) / scores.length + fx().qual + toolTotal() * 0.004; q = clamp(q, 0.05, 1.1);
    const base = assist ? 70 : job.price; let pay = Math.round(base * (0.55 + 0.55 * Math.min(1, q)));
    if (q > 0.9) tip += Math.round(base * 0.1);
    addCash(pay + tip); Snd.play('coin');
    workCost({ wear: assist ? 0.3 : 0.65, energy: assist ? 10 : 18, hours: 0, skill: true });
    gainStat('tool', 0.3 + (q > 0.8 ? 0.15 : 0)); gainStat('int', 0.06); gainStat('str', 0.05); gainStat('end', 0.05);
    if (assist) { S.c.assists++; S.day.assist++; }
    else { S.c.chimneys++; S.jobs = S.jobs.filter(x => x !== job); S.biz.rep += q > 0.75 ? 2 : q > 0.45 ? 1 : -1; S.biz.earned += pay; }
    const grade = q > 0.9 ? 'A+' : q > 0.75 ? 'A' : q > 0.6 ? 'B' : q > 0.4 ? 'C' : 'D';
    Dialog.say('Narrator', (assist ? 'Helped your brother. ' : job.client + ' inspects it, squints, nods. ') + 'Quality ' + Math.round(q * 100) + '% (' + grade + '). Paid ' + money(pay) + (tip ? ' + tip ' + money(tip) : '') + '.' + (fell ? ' Ladder bruise included.' : '') + ' Tool skill up.');
    if (job.tut) { S.f.firstChimney = 1; }
    offerFilm();
  };
  next();
}

function climbDone(res) {
  const st = res.climb || {}, cs = climbState(), sev = clamp(st.sev | 0, 0, 3), T = CL_SEV[sev];
  const ins = S.f.cityJob ? 0.25 : 1;
  cs.runs++; if (st.nest !== 'cleared') cs.carry = Math.min(3, cs.carry + 1); /* the mistake you carried up stays up there */
  cs.last = { nest: st.nest, ghost: !!st.ghost, sev, c: st.c, heard: !!st.heard };
  S.f.climbDone = 1;
  let pay = T.pay + (st.cap ? 25 : 0); addCash(pay);
  workCost({ wear: 0.7, energy: 0, hours: 0, skill: true });
  gainStat('tool', Math.max(0.1, 0.45 - sev * 0.1)); gainStat('int', 0.1);
  S.biz.rep += sev <= 1 ? 3 : 1; S.biz.earned += pay; S.c.quality += sev === 0 ? 1 : 0;
  if (sev === 3) { /* lost day: Bro and a neighbor get you down; ER overnight. Not a game over. */
    S.hp = Math.max(5, S.hp - T.hp); S.body = Math.max(0, S.body - 2); S.hp = Math.min(S.hp, S.body);
    advance((1440 - (S.t % 1440)) + 8 * 60, { sleeping: true }); S.energy = 50; S.hunger = 60; S.family = clamp(S.family - 4, 0, 100);
  } else {
    advance(T.mins, { noEnergy: true });
    if (T.hp) { S.hp = Math.max(5, S.hp - T.hp); S.happy = clamp(S.happy - 3, 0, 100); }
    if (sev === 2) { S.energy = Math.max(S.energy, 10); S.family = clamp(S.family - 2, 0, 100); }
  }
  if (T.bill) { const bill = Math.round(T.bill * ins), fromBank = Math.min(S.bank, bill); S.bank -= fromBank; S.debt += bill - fromBank; }
  Snd.play(sev <= 1 ? 'coin' : 'lose');
  toast('The Climb: ' + T.title + ' ' + money(pay) + (T.bill ? '  (medical -' + money(Math.round(T.bill * ins)) + ')' : ''), sev <= 1 ? '#8f8' : '#fa8');
  Dialog.say('Narrator', T.tag + ' Paid ' + money(pay) + (st.cap ? ' (cap bonus included)' : '') + '.' + (T.bill ? ' Medical: ' + money(Math.round(T.bill * ins)) + '.' : ''));

}

function talkDad() {

/* ----- SAVE EXPORT / IMPORT (copy-paste a base64 string; works from the title screen too) -----
   Wrapper {g:'stickrpg_wa', v:1, s:<save>} -> JSON -> UTF-8 -> base64. Import also accepts a bare save, plain JSON, or url-safe base64. */
const XFER_TAG = 'stickrpg_wa', XFER_BACKUP = 'stickrpg_wa_preimport_backup_v1';

}

  const copy = JSON.parse(JSON.stringify(src || S)); copy.savedAt = Date.now();

}
function parseSaveString(str) { // -> { ok, data, err, info }

  if (!s) return { ok: false, err: 'Nothing to import. Paste a save string first.' };
  if (s.length > 4e6) return { ok: false, err: 'That is far too big to be a save.' };

    const u = s.replace(/-/g, '+').replace(/_/g, '/'), raw = s[0] === '{' ? s : b64dec(u + '='.repeat((4 - u.length % 4) % 4));

  if (obj.v && obj.v > 1) return { ok: false, err: 'This save is from a newer version of the game.' };
  stripUnsafe(d);

  S = deepMerge(newState(nm), r.data); S.name = nm; S.toasts = []; S.pend = Array.isArray(S.pend) ? S.pend : [];

  if (checkVitals()) return;

}
